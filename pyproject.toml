[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-ehr-conversion"
version = "0.1.0"
description = "Proof-of-concept EHR conversion: Halcyon (legacy, synthetic) -> Nimbus (modern, invented) via Bridge"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "mcp>=2.0",
  "orjson>=3.10",  # faster JSON encoding (exact results guaranteed by bridge/jsonx.py)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["bridge*", "nimbus*", "testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
