name: Profile slow integration tests

on:
  pull_request:
    paths:
      - '.github/workflows/profile-slow-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Profile five slowest integration tests
        run: |
          python - <<'PY'
          import cProfile
          import pstats
          import pytest
          import time

          tests = [
              "test_demo_runs_end_to_end",
              "test_revert_type_then_run",
              "test_cutover_delta",
              "test_second_rehearsal_reuses_answers",
              "test_cutover_matches_mutator_delta",
          ]
          for test in tests:
              print(f"\\n=== {test} ===", flush=True)
              profiler = cProfile.Profile()
              start = time.perf_counter()
              profiler.enable()
              result = pytest.main(["-q", "-x", "-k", test, "--durations=3"])
              profiler.disable()
              print(f"Elapsed: {time.perf_counter()-start:.2f}s; pytest exit: {result}", flush=True)
              pstats.Stats(profiler).sort_stats("cumulative").print_stats(80)
              print("=== Highest self-time functions ===", flush=True)
              pstats.Stats(profiler).sort_stats("tottime").print_stats(35)
              if result != 0:
                  raise SystemExit(result)
          PY
