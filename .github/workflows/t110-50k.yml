name: T-110 full 50k scalability verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/t110-50k.yml'
      - 'tools/bench.py'
  workflow_dispatch:

concurrency:
  group: t110-50k-scalability
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  full-50k:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Cancel superseded 50k benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in 40129668644 40135474549 40135491980 40135502861 40135570842; do
            echo "Canceling obsolete run $id"
            gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/cancel" || gh api -X POST "repos/${{ github.repository }}/actions/runs/$id/force-cancel" || true
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Full end-to-end 50,000-patient conversion
        run: |
          mkdir -p benchmark-output
          /usr/bin/time -v python -u tools/bench.py --patients 50000 --seed 42 > benchmark-output/50k.json 2> >(tee benchmark-output/resources-and-progress.log >&2)
          cat benchmark-output/50k.json
          cat benchmark-output/resources-and-progress.log
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmark-output/50k.json").read_text())
          assert data["patients"] == 50000
          assert data["first_pass_only"] is False
          assert data["run_status"] == "completed", data["run_status"]
          assert data["records_total"] >= 50000, data.get("records_total")
          assert data["loaded_records"] > 0, data.get("loaded_records")
          print("FULL_50K_VERIFIED", data["conversion_seconds"])
          PY
      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t110-full-50k
          path: benchmark-output/
          if-no-files-found: warn

  short-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Regression tests
        run: python -m pytest -q tests/bridge/test_work_queue_performance.py tests/nimbus/test_reference_index.py tests/test_scalability_indexes.py
      - name: Scaling measurements
        run: |
          mkdir -p benchmark-output
          for n in 1000 2000 5000 10000; do
            python -u tools/bench.py --patients "$n" --seed 42 > "benchmark-output/$n.json" 2> "benchmark-output/$n.log"
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print(d["patients"],d["run_status"],d["conversion_seconds"],d["loaded_records"]); assert d["run_status"] == "completed" and d["loaded_records"] > 0' "benchmark-output/$n.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t110-short-validation
          path: benchmark-output/
