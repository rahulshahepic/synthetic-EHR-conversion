name: T-110 scalability validation (50k manual only; weekly 2k-10k)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/t110-50k.yml'
      - 'tools/bench.py'
      - 'src/bridge/**'
      - 'src/nimbus/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      benchmark_size:
        description: 'Benchmark tier (larger runs require explicit dispatch)'
        required: true
        type: choice
        default: short
        options:
          - short
          - scaling
          - full-50k
  schedule:
    # Weekly scaling check on main (Mondays 06:17 UTC): catches throughput or growth regressions
    # that the 100-1000 patient PR tier is too small to show.
    - cron: '17 6 * * 1'

concurrency:
  group: t110-50k-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  full-50k:
    if: github.event_name == 'workflow_dispatch' && inputs.benchmark_size == 'full-50k'
    runs-on: ubuntu-latest
    # Measured 2k-10k throughput projects ~25 minutes; a hard cap keeps a regression from running for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Put benchmark databases on the large temp disk
        # Run and Nimbus databases plus WAL reach ~20 GB at 50k patients (~400 MB per 1k measured locally).
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/bench && sudo chown "$(id -u):$(id -g)" /mnt/bench
          echo "TMPDIR=/mnt/bench" >> "$GITHUB_ENV"
      - name: Full end-to-end 50,000-patient conversion
        run: |
          mkdir -p benchmark-output
          /usr/bin/time -v python -u tools/bench.py --patients 50000 --seed 42 > benchmark-output/50k.json 2> >(tee benchmark-output/resources-and-progress.log >&2)
          cat benchmark-output/50k.json
          cat benchmark-output/resources-and-progress.log
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("benchmark-output/50k.json").read_text())
          assert data["patients"] == 50000
          assert data["first_pass_only"] is False
          assert data["run_status"] == "completed", data["run_status"]
          assert data["records_total"] >= 50000, data.get("records_total")
          assert data["loaded_records"] > 0, data.get("loaded_records")
          assert data.get("verification") and data["verification"].get("ok") is True, data.get("verification")
          assert data.get("fidelity_mean_loaded") is not None, data.get("fidelity_mean_loaded")
          assert data.get("conversion_seconds", 0) > 0, data.get("conversion_seconds")
          assert data.get("peak_rss_mb", 0) > 0, data.get("peak_rss_mb")
          print("FULL_50K_VERIFIED", data["conversion_seconds"])
          PY
      - name: Disk usage
        if: always()
        run: df -h / /mnt
      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: t110-full-50k
          path: benchmark-output/
          if-no-files-found: warn

  scaling-validation:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.benchmark_size == 'scaling')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Complete 2k, 5k, and 10k-patient conversions
        run: |
          mkdir -p benchmark-output
          for n in 2000 5000 10000; do
            echo "::group::Benchmark $n patients"
            /usr/bin/time -v python -u tools/bench.py --patients "$n" --seed 42 > "benchmark-output/$n.json" 2> >(tee "benchmark-output/$n.log" >&2)
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("RESULT",d["patients"],d["run_status"],d["conversion_seconds"],d["loaded_records"],flush=True); assert d["run_status"] == "completed" and d["loaded_records"] > 0 and d["verification"]["ok"]' "benchmark-output/$n.json"
            echo "::endgroup::"
          done
          df -h / /mnt
      - name: Per-patient cost must stay roughly flat from 2k to 10k
        # Measured 29.0 -> 29.8 ms/patient; a quadratic cost shows up here long before it reaches 50k.
        run: |
          python - <<'PY'
          import json
          per = {n: json.load(open(f"benchmark-output/{n}.json"))["conversion_seconds"] * 1000 / n for n in (2000, 5000, 10000)}
          print({n: round(v, 1) for n, v in per.items()}, "ms/patient")
          assert per[10000] <= 1.25 * per[2000], f"10k costs {per[10000] / per[2000]:.2f}x per patient vs 2k (limit 1.25x)"
          PY
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: t110-scaling-validation
          path: benchmark-output/

  short-validation:
    if: github.event_name == 'pull_request' || inputs.benchmark_size == 'short'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Short smoke and scaling measurements (live output)
        timeout-minutes: 12
        run: |
          mkdir -p benchmark-output
          for n in 100 250 500 1000; do
            echo "::group::Benchmark $n patients"
            echo "Starting $n patients at $(date -u +%FT%TZ)"
            /usr/bin/time -v python -u tools/bench.py --patients "$n" --seed 42 > "benchmark-output/$n.json" 2> >(tee "benchmark-output/$n.log" >&2)
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("RESULT",d["patients"],d["run_status"],d["conversion_seconds"],d["loaded_records"],flush=True); assert d["run_status"] == "completed" and d["loaded_records"] > 0' "benchmark-output/$n.json"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: t110-short-validation
          path: benchmark-output/
