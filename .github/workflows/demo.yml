name: Conversion demo

# Runs the end-to-end demo (rehearsal 1, verification, readiness, rehearsal 2, cutover) and publishes:
#  - the narrated transcript as this run's Summary page, plus the HTML run report as a downloadable artifact;
#  - a history of styled reports on GitHub Pages: https://rahulshahepic.github.io/synthetic-EHR-conversion/
#    (one-time repo setting: Settings -> Pages -> Source: "GitHub Actions").
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      patients:
        description: "Synthetic patients to generate"
        default: "300"
      seed:
        description: "Random seed"
        default: "42"

permissions:
  contents: read

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run demo
        run: |
          python -m testbed.demo --out demo_out \
            --patients "${{ github.event.inputs.patients || '300' }}" \
            --seed "${{ github.event.inputs.seed || '42' }}"
      - name: Lakeside (second source system) run summary
        run: python tools/lakeside_summary.py demo_out/lakeside >> demo_out/DEMO_TRANSCRIPT.md
      - name: Publish summary
        run: cat demo_out/DEMO_TRANSCRIPT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: conversion-demo-${{ github.run_number }}
          path: |
            demo_out/DEMO_TRANSCRIPT.md
            demo_out/*.html
          retention-days: 30
      - name: Build site
        run: python tools/build_site.py demo_out site
      - uses: actions/upload-artifact@v5
        with:
          name: demo-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
          retention-days: 7

  archive:
    needs: demo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v5
        with:
          name: demo-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Archive report and prune old runs
        run: bash tools/archive_pages.sh
      - name: Link to this run
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          runs = json.loads((Path(os.environ['RUNNER_TEMP']) / 'pages-archive' / 'runs.json').read_text())
          run = next(r for r in runs if r['run_id'] == int(os.environ['GITHUB_RUN_ID'])
                     and r['attempt'] == int(os.environ['GITHUB_RUN_ATTEMPT']))
          print(f"[View this demo on GitHub Pages](https://rahulshahepic.github.io/synthetic-EHR-conversion/{run['path']})")
          PY

  pages:
    needs: archive
    runs-on: ubuntu-latest
    concurrency:
      group: conversion-demo-pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: archive
      - name: Prepare site without Git metadata
        run: |
          mkdir site
          rsync -a --exclude=.git archive/ site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
